; lumary-zigbee/platformio.ini

; Host-side unit tests for hardware-independent logic (pixel encoding, colour
; math). Run with: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -I src
build_src_filter = -<*>          ; src/ needs ESP-IDF; tests include headers directly

[env:esp32h2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-h2-devkitm-1
framework = arduino
monitor_speed = 115200
; ZBOSS asserts at startup unless the table provides zb_storage and zb_fct
; ("Failed to find zb_storage partition", zb_esp_nvram.c:84) -- min_spiffs.csv
; has neither, so rev A panic-looped on first boot. The _zczr variant matches
; the ZIGBEE_MODE_ZCZR build below and keeps app0/app1 for Zigbee OTA.
board_build.partitions = zigbee_zczr.csv
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Zigbee router (ZCZR) rather than end device: these are mains-powered ceiling
  ; fixtures, so each one should route for the others. The mode is selected at
  ; link time by which stack variant is pulled in.
  -DZIGBEE_MODE_ZCZR
  ; IDF 5.5 renamed these: esp_zb_api_zczr -> esp_zb_api.zczr, and zboss_port
  ; gained a .native suffix. Older platforms (53.x) use the underscore names.
  -lesp_zb_api.zczr
  -lzboss_stack.zczr
  -lzboss_port.native
